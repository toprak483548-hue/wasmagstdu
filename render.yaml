databases:
  - name: mesaj-app-db
    databaseName: mesaj_app
    user: mesaj_app_user
    plan: free

services:
  - type: web
    name: mesaj-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mesaj-app-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
